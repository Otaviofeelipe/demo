<body style="font:16px system-ui;padding:24px">
<p id="m">A abrir o WhatsApp…</p>
<script>
var p=new URLSearchParams(location.search),d=p.get('d')||'',l=(p.get('l')||'pt').slice(0,2);
var T={pt:'Olá! Vi a prévia do site ({d}) e quero saber mais.',en:"Hi! I saw the website preview ({d}) and I'd like to know more.",

</script></body></html>
